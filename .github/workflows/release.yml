name: Release Application

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc
            label: windows-x64
          - os: windows-latest
            rust-targets: aarch64-pc-windows-msvc
            tauri-args: --target aarch64-pc-windows-msvc
            label: windows-arm64
          - os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            tauri-args: --target x86_64-unknown-linux-gnu
            label: linux-x64
          - os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin
            label: macos-universal

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "Setting release version to ${VERSION}..."
          node -e "
            const fs = require('fs');
            const v = '${VERSION}';

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== v) {
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }

            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = v;
              if (lock.packages && lock.packages['']) {
                lock.packages[''].version = v;
              }
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            const updatedCargo = cargo.replace(/^version\s*=\s*\".*\"/m, 'version = \"' + v + '\"');
            if (cargo !== updatedCargo) {
              fs.writeFileSync('src-tauri/Cargo.toml', updatedCargo);
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-all-targets: "true"
          cache-on-failure: "true"
          prefix-key: "v2-rust-${{ matrix.label }}"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || 'v0.1.0' }}
          releaseName: "Od-Lagna ${{ github.ref_name || 'v0.1.0' }}"
          releaseBody: "Od-Lagna offline archive release for Windows, macOS, Linux, Android, and iOS."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.tauri-args }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "Setting release version to ${VERSION}..."
          node -e "
            const fs = require('fs');
            const v = '${VERSION}';

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== v) {
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }

            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = v;
              if (lock.packages && lock.packages['']) {
                lock.packages[''].version = v;
              }
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            const updatedCargo = cargo.replace(/^version\s*=\s*\".*\"/m, 'version = \"' + v + '\"');
            if (cargo !== updatedCargo) {
              fs.writeFileSync('src-tauri/Cargo.toml', updatedCargo);
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Configure Android NDK
        run: |
          ANDROID_NDK_HOME=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-all-targets: "true"
          cache-on-failure: "true"
          prefix-key: "v2-rust-android"

      - name: Build Android APK
        run: |
          npx tauri android init --ci || true
          npx tauri android build --apk

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          mkdir -p dist-android
          APK_COUNT=0
          while IFS= read -r apk; do
            [ -f "$apk" ] || continue
            APK_NAME=$(basename "$apk")
            CLEAN_NAME=$(echo "$APK_NAME" | sed 's/^app-//' | sed 's/-unsigned//' | sed 's/-release//' | sed 's/\.apk$//')
            if [ "$CLEAN_NAME" = "universal" ] || [ -z "$CLEAN_NAME" ]; then
              NEW_NAME="Od-Lagna_${VERSION}_android.apk"
            else
              NEW_NAME="Od-Lagna_${VERSION}_android_${CLEAN_NAME}.apk"
            fi
            cp "$apk" "dist-android/$NEW_NAME"
            echo "Prepared $apk -> dist-android/$NEW_NAME"
            APK_COUNT=$((APK_COUNT + 1))
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "Error: No APK files found in src-tauri/gen/android/app/build/outputs/apk"
            exit 1
          fi

          echo "Found $APK_COUNT APK asset(s). Checking GitHub Release for $TAG..."
          for i in {1..15}; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG found."
              break
            fi
            echo "Waiting for release $TAG to be created ($i/15)..."
            sleep 10
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release not found; creating release $TAG..."
            gh release create "$TAG" --title "Od-Lagna $TAG" --notes "Od-Lagna offline archive release for Windows, macOS, Linux, Android, and iOS."
          fi

          for file in dist-android/*.apk; do
            echo "Uploading $file..."
            gh release upload "$TAG" "$file" --clobber
          done

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync version from git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          RAW_TAG="${{ github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "Setting release version to ${VERSION}..."
          node -e "
            const fs = require('fs');
            const v = '${VERSION}';

            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.version !== v) {
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }

            if (fs.existsSync('package-lock.json')) {
              const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
              lock.version = v;
              if (lock.packages && lock.packages['']) {
                lock.packages[''].version = v;
              }
              fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
            }

            let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
            const updatedCargo = cargo.replace(/^version\s*=\s*\".*\"/m, 'version = \"' + v + '\"');
            if (cargo !== updatedCargo) {
              fs.writeFileSync('src-tauri/Cargo.toml', updatedCargo);
            }
          "

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> src-tauri/target"
          cache-all-targets: "true"
          cache-on-failure: "true"
          prefix-key: "v2-rust-ios"

      - name: Build iOS Application
        run: |
          npx tauri ios init --ci || true
          npm run build
          npx tauri ios build --ci --no-sign || {
            APP_NAME=$(node -p "require('./src-tauri/tauri.conf.json').productName || 'Od-Lagna'")
            xcodebuild archive \
              -project src-tauri/gen/apple/${APP_NAME}.xcodeproj \
              -scheme "${APP_NAME}_iOS" \
              -configuration Release \
              -archivePath src-tauri/gen/apple/build/${APP_NAME}.xcarchive \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          }

      - name: Package Sideloadable IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" | head -n 1)
          if [ -d "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
            zip -r od-lagna.ipa Payload/
          else
            echo "App bundle not found, packaging skipped."
          fi

      - name: Upload IPA to Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          if [ -f od-lagna.ipa ]; then
            RELEASE_IPA="Od-Lagna_${VERSION}_ios.ipa"
            cp od-lagna.ipa "$RELEASE_IPA"
            echo "Prepared $RELEASE_IPA for release upload."

            for i in {1..15}; do
              if gh release view "$TAG" >/dev/null 2>&1; then
                echo "Release $TAG found."
                break
              fi
              echo "Waiting for release $TAG to be created ($i/15)..."
              sleep 10
            done

            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release not found; creating release $TAG..."
              gh release create "$TAG" --title "Od-Lagna $TAG" --notes "Od-Lagna offline archive release for Windows, macOS, Linux, Android, and iOS."
            fi

            echo "Uploading $RELEASE_IPA to release $TAG..."
            gh release upload "$TAG" "$RELEASE_IPA" --clobber
          else
            echo "No od-lagna.ipa found, skipping upload."
          fi
